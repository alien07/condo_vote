name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full e2e suite, including @full tests"
        type: boolean
        default: true

jobs:
  web:
    name: Web checks
    # Pinned: Playwright 1.60 does not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    env:
      # Google OAuth is not used by e2e tests; supabase/config.toml still needs values.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-not-used
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Select e2e smoke specs
        id: specs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full }}" = "true" ]; then
            specs="ALL"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            specs=$(node scripts/select-e2e-specs.mjs "origin/${{ github.base_ref }}" || echo ALL)
          else
            specs=$(node scripts/select-e2e-specs.mjs "${{ github.event.before }}" || echo ALL)
          fi
          if [ "$specs" = "ALL" ]; then
            # Full suite, including @full end-to-end tests.
            echo "Selected: full suite"
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            # Smoke test: changed domains only, without @full tests.
            echo "Selected: $specs (smoke, without @full)"
            echo "args=$specs --grep-invert @full" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Supabase
        run: npx supabase start -x studio,postgres-meta,imgproxy,vector,logflare,edge-runtime

      - name: Write test env
        run: npm run env:test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test ${{ steps.specs.outputs.args }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
