name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  web:
    name: Web checks
    # Pinned: Playwright 1.60 does not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    env:
      # Google OAuth is not used by e2e tests; supabase/config.toml still needs values.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-not-used
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Select e2e smoke specs
        id: specs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          specs=$(node scripts/select-e2e-specs.mjs "$base" || echo ALL)
          if [ "$specs" = "ALL" ]; then specs=""; fi
          echo "Selected: ${specs:-full suite}"
          echo "list=$specs" >> "$GITHUB_OUTPUT"

      - name: Start Supabase
        run: npx supabase start -x studio,postgres-meta,imgproxy,vector,logflare,edge-runtime

      - name: Write test env
        run: npm run env:test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npx playwright test ${{ steps.specs.outputs.list }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
